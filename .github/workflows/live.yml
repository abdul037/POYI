name: live

# Runs Poyi against the real Claude API using the ANTHROPIC_API_KEY repository
# secret. Triggered by pushes to build/** branches (cheap smoke) and by hand.
# The character eval (about 40 model calls) runs when the commit message
# contains [eval] or when dispatched with eval=true.

on:
  push:
    branches: ["build/**"]
  workflow_dispatch:
    inputs:
      eval:
        description: "run the character eval"
        type: boolean
        default: true

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POYI_USER: Abdul
      POYI_NOTIFY: "false"
      POYI_HOME: ${{ github.workspace }}/.poyi-ci
      PYTHONUNBUFFERED: "1"
      POYI_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: unit tests (no network)
        run: pytest -q
      - name: doctor
        run: poyi doctor
      - name: tools, time and arithmetic
        run: poyi say "What time is it right now, and what is 17 percent of 2,340?"
      - name: memory write
        run: |
          poyi say "Remember that my sister is called Amina and she lives in Leeds."
          echo "--- profile after ---"
          poyi memory show profile
          echo "--- today's log ---"
          poyi memory show today
          echo "--- files ---"
          poyi memory
      - name: memory recall in a fresh session
        run: poyi say "What do you know about my family?"
      - name: web search
        run: poyi say "In one line, what is the top headline in the news today? Search for it."
      - name: the picture and a write-back
        run: |
          poyi say "I'm heading out to the dentist at half eleven, back by one."
          echo "--- world ---"
          poyi world
      - name: nightly pass (dry run)
        run: poyi consolidate --dry-run
      - name: morning brief
        run: poyi brief morning
      - name: usage so far
        run: poyi usage
      - name: character eval
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.eval || contains(github.event.head_commit.message, '[eval]') }}
        run: poyi eval character --verbose
