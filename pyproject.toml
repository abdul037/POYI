[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poyi"
version = "0.1.0"
description = "Poyi - Prodigy Of Your Invention. A human-like, highly intelligent companion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.4.0",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.5",
  "faster-whisper>=1.1",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
poyi = "poyi.cli:main"

[tool.setuptools.packages.find]
include = ["poyi*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
