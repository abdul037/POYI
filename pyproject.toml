[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poyi"
version = "0.1.0"
description = "Poyi - Prodigy Of Your Invention. A human-like, highly intelligent companion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
poyi = "poyi.cli:main"

[tool.setuptools]
packages = ["poyi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
